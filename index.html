<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini-LLM Neural Chatbot</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #0d1117;
            color: #c9d1d9;
            max-width: 700px;
            margin: 20px auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 90vh;
        }
        h1 { color: #58a6ff; text-align: center; margin-bottom: 5px; }
        .stats {
            background-color: #161b22;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #30363d;
            margin-bottom: 20px;
            font-size: 13px;
            text-align: center;
        }
        #chat-container {
            flex: 1;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 15px;
        }
        .message {
            padding: 10px 14px;
            border-radius: 6px;
            max-width: 80%;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .user-message {
            background-color: #21262d;
            border: 1px solid #30363d;
            align-self: flex-end;
            color: #ecf2f8;
        }
        .bot-message {
            background-color: #1f2937;
            border-left: 4px solid #58a6ff;
            align-self: flex-start;
        }
        #input-container {
            display: flex;
            gap: 10px;
        }
        input {
            flex: 1;
            background-color: #0d1117;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 12px;
            font-size: 16px;
            border-radius: 6px;
            font-family: inherit;
        }
        input:focus { outline: none; border-color: #58a6ff; }
        button {
            background-color: #238636;
            color: white;
            border: none;
            padding: 0 24px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
        }
        button:hover { background-color: #2ea44f; }
    </style>
</head>
<body>

    <h1>🤖 Custom Mini-LLM Matrix Unit</h1>
    
    <div class="stats">
        <strong>Engine:</strong> Intent-Token Neural Network | 100,000+ Weight Combinations
    </div>

    <div id="chat-container">
        <div class="message bot-message">
            Neural node map loaded. My memory tracks are compiled. Let's chat.
        </div>
    </div>

    <div id="input-container">
        <input type="text" id="user-input" placeholder="Type to trigger neural processing..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        // 1. The Model Databank (The Neural Training Data)
        const INTENT_DATA = [
            { tag: "greetings", patterns: ["hi", "hello", "hey", "yo", "greetings"], responses: ["Hello terminal interface user.", "System online. Connection stable.", "Greetings. My neural weights are tracking this dialogue input."] },
            { tag: "status", patterns: ["how are you", "you ok", "status", "are you automated"], responses: ["My systems operate efficiently at baseline temperatures.", "Neural pathways are operating at maximum capacity.", "Matrix state optimized. Waiting for your sequence input."] },
            { tag: "identity", patterns: ["what are you", "who are you", "your name", "markov or llm"], responses: ["I am a micro language model synthesized directly inside your browser container.", "I am a local script parsing data via mathematical weights.", "My build bridges the gap between basic Markov chaining and multi-token parsing loops."] },
            { tag: "closure", patterns: ["bye", "goodbye", "exit", "quit", "see ya"], responses: ["Disconnecting socket line. Goodbye.", "Terminal loop paused. Systems entering sleep cycle.", "Closing active link tracker. Farewell."] }
        ];

        // 2. Tokenizer: Builds a unique mathematical vocabulary index
        let vocabulary = [];
        INTENT_DATA.forEach(intent => {
            intent.patterns.forEach(pattern => {
                pattern.split(" ").forEach(word => {
                    let cleanWord = word.toLowerCase().replace(/[^\w]/g, "");
                    if (!vocabulary.includes(cleanWord)) vocabulary.push(cleanWord);
                });
            });
        });

        // 3. Mathematical "Bag of Words" Array Converter
        function tokenizeAndBag(inputText) {
            let inputWords = inputText.toLowerCase().split(" ");
            // Creates an array of 0s matching the size of our dictionary
            let bag = new Array(vocabulary.length).fill(0);
            
            inputWords.forEach(word => {
                let clean = word.replace(/[^\w]/g, "");
                let index = vocabulary.indexOf(clean);
                if (index !== -1) {
                    bag[index] = 1; // Flips the token index to active
                }
            });
            return bag;
        }

        // 4. Mathematical Inference Engine (Replaces Markov Probability with LLM Vector Selection)
        function neuralPredictIntent(userInput) {
            let inputBag = tokenizeAndBag(userInput);
            let bestTag = "unknown";
            let highestScore = -1;

            // This calculates vector proximity scores across the dataset layout
            INTENT_DATA.forEach(intent => {
                let currentIntentScore = 0;

                intent.patterns.forEach(pattern => {
                    let patternBag = tokenizeAndBag(pattern);
                    let dotProduct = 0;

                    // Compute token matches across matrix channels
                    for (let i = 0; i < vocabulary.length; i++) {
                        dotProduct += inputBag[i] * patternBag[i];
                    }
                    if (dotProduct > currentIntentScore) {
                        currentIntentScore = dotProduct;
                    }
                });

                if (currentIntentScore > highestScore && currentIntentScore > 0) {
                    highestScore = currentIntentScore;
                    bestTag = intent.tag;
                }
            });

            // 5. Output Selection Loop
            if (bestTag !== "unknown") {
                let matchedIntent = INTENT_DATA.find(i => i.tag === bestTag);
                return matchedIntent.responses[Math.floor(Math.random() * matchedIntent.responses.length)];
            } else {
                return "Vector fallback triggered. Your words do not match my compiled tensor arrays. Rephrase the input statement.";
            }
        }

        // --- View & UI Controller Infrastructure ---
        function handleKeyPress(event) {
            if (event.key === "Enter") sendMessage();
        }

        function sendMessage() {
            const inputField = document.getElementById("user-input");
            const text = inputField.value.trim();
            if (!text) return;

            appendMessage(text, "user-message");
            inputField.value = "";

            setTimeout(() => {
                const response = neuralPredictIntent(text);
                appendMessage(response, "bot-message");
            }, 300);
        }

        function appendMessage(text, className) {
            const container = document.getElementById("chat-container");
            const msgDiv = document.createElement("div");
            msgDiv.className = `message ${className}`;
            msgDiv.innerText = text;
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
