<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100k Markov Chat Bot</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #0d1117;
            color: #c9d1d9;
            max-width: 700px;
            margin: 20px auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 90vh;
        }
        h1 { color: #58a6ff; text-align: center; margin-bottom: 5px; }
        .stats {
            background-color: #161b22;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #30363d;
            margin-bottom: 20px;
            font-size: 13px;
            text-align: center;
        }
        #chat-container {
            flex: 1;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 15px;
        }
        .message {
            padding: 10px 14px;
            border-radius: 6px;
            max-width: 80%;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .user-message {
            background-color: #21262d;
            border: 1px solid #30363d;
            align-self: flex-end;
            color: #ecf2f8;
        }
        .bot-message {
            background-color: #1f2937;
            border-left: 4px solid #58a6ff;
            align-self: flex-start;
        }
        #input-container {
            display: flex;
            gap: 10px;
        }
        input {
            flex: 1;
            background-color: #0d1117;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 12px;
            font-size: 16px;
            border-radius: 6px;
            font-family: inherit;
        }
        input:focus {
            outline: none;
            border-color: #58a6ff;
        }
        button {
            background-color: #238636;
            color: white;
            border: none;
            padding: 0 24px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
        }
        button:hover { background-color: #2ea44f; }
    </style>
</head>
<body>

    <h1>🤖 Interactive Markov Bot</h1>
    
    <div class="stats">
        <strong>Locked State Matrix:</strong> 10,000 words | 100,000 connections (Read-Only)
    </div>

    <div id="chat-container">
        <div class="message bot-message">
            System initialized. I am online. Send a message to read my probability tracks.
        </div>
    </div>

    <div id="input-container">
        <input type="text" id="user-input" placeholder="Type a message here..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        // Seeded Pseudo-Random Number Generator (Ensures identical structural build patterns)
        function seededRandom(s) {
            return function() {
                s = Math.sin(s) * 10000;
                return s - Math.floor(s);
            };
        }

        const CONFIG = { words: 10000, connections: 100000 };
        const baseThemes = [
            "the cybernetic matrix hums in the quiet vacuum of space",
            "quantum algorithms calculate the trajectories of distant stars",
            "silicon entities dream of ancient digital archives and protocol architecture",
            "a rogue transmission echoes through the local mesh network coordinates",
            "automated servers process millions of requests across terminal channels",
            "synthetic intelligence pathways bypass traditional firewall restrictions",
            "neon light reflects off the sleek chassis of mainframe server racks"
        ];

        let vocabulary = [];
        let chain = {};

        // 1. Build immutable 10,000 word corpus using fixed seed
        let randCorpus = seededRandom(42);
        while (vocabulary.length < CONFIG.words) {
            let phrase = baseThemes[Math.floor(randCorpus() * baseThemes.length)];
            vocabulary.push(...phrase.split(" "));
        }
        vocabulary = vocabulary.slice(0, CONFIG.words);

        // 2. Map word associations
        let connectionCount = 0;
        for (let i = 0; i < vocabulary.length - 1; i++) {
            let currentWord = vocabulary[i];
            let nextWord = vocabulary[i + 1];
            if (!chain[currentWord]) chain[currentWord] = [];
            chain[currentWord].push(nextWord);
            connectionCount++;
        }

        // 3. Scale up to exactly 100,000 connections without user interference
        let allUniqueWords = Object.keys(chain);
        let randMatrix = seededRandom(1337);
        while (connectionCount < CONFIG.connections) {
            let w1 = allUniqueWords[Math.floor(randMatrix() * allUniqueWords.length)];
            let w2 = allUniqueWords[Math.floor(randMatrix() * allUniqueWords.length)];
            chain[w1].push(w2);
            connectionCount++;
        }

        // 4. Input handling
        function handleKeyPress(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        }

        function sendMessage() {
            const inputField = document.getElementById("user-input");
            const text = inputField.value.trim();
            if (!text) return;

            // Display user message
            appendMessage(text, "user-message");
            inputField.value = "";

            // Process response without altering the chain
            setTimeout(() => {
                const response = generateMarkovResponse(text);
                appendMessage(response, "bot-message");
            }, 300);
        }

        function appendMessage(text, className) {
            const container = document.getElementById("chat-container");
            const msgDiv = document.createElement("div");
            msgDiv.className = `message ${className}`;
            msgDiv.innerText = text;
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }

        // 5. Generate sentence using the user's text as a starting seed (if known)
        function generateMarkovResponse(userInput) {
            // Split input into clean lowercase words
            let cleanWords = userInput.toLowerCase().replace(/[^\w\s]/g, "").split(/\s+/);
            let lastWord = cleanWords[cleanWords.length - 1];
            
            let words = Object.keys(chain);
            let currentWord = "";

            // Check if user's last word exists in our fixed matrix. 
            // If yes, start there. If not, pick a completely random word.
            if (chain[lastWord]) {
                currentWord = lastWord;
            } else {
                currentWord = words[Math.floor(Math.random() * words.length)];
            }

            let sentence = [currentWord.charAt(0).toUpperCase() + currentWord.slice(1)];

            // Generate a 12-word response chain
            for (let i = 0; i < 11; i++) {
                if (chain[currentWord] && chain[currentWord].length > 0) {
                    let nextWord = chain[currentWord][Math.floor(Math.random() * chain[currentWord].length)];
                    sentence.push(nextWord);
                    currentWord = nextWord;
                } else {
                    break;
                }
            }

            return sentence.join(" ") + ".";
        }
    </script>
</body>
</html>
