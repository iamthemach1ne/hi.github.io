<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100k Markov Chat Bot with Memory</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #0d1117;
            color: #c9d1d9;
            max-width: 700px;
            margin: 20px auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 90vh;
        }
        h1 { color: #58a6ff; text-align: center; margin-bottom: 5px; }
        .stats {
            background-color: #161b22;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #30363d;
            margin-bottom: 20px;
            font-size: 13px;
            text-align: center;
        }
        #chat-container {
            flex: 1;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 15px;
        }
        .message {
            padding: 10px 14px;
            border-radius: 6px;
            max-width: 80%;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .user-message {
            background-color: #21262d;
            border: 1px solid #30363d;
            align-self: flex-end;
            color: #ecf2f8;
        }
        .bot-message {
            background-color: #1f2937;
            border-left: 4px solid #58a6ff;
            align-self: flex-start;
        }
        #input-container {
            display: flex;
            gap: 10px;
        }
        input {
            flex: 1;
            background-color: #0d1117;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 12px;
            font-size: 16px;
            border-radius: 6px;
            font-family: inherit;
        }
        input:focus {
            outline: none;
            border-color: #58a6ff;
        }
        button {
            background-color: #238636;
            color: white;
            border: none;
            padding: 0 24px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
        }
        button:hover { background-color: #2ea44f; }
    </style>
</head>
<body>

    <h1>🤖 Markov Bot (Second-Order Memory)</h1>
    
    <div class="stats">
        <strong>Locked State Matrix:</strong> 10,000 words | 100,000 contextual state pairs (Read-Only)
    </div>

    <div id="chat-container">
        <div class="message bot-message">
            Contextual memory engine online. Send a message to pull calculated logical tracks from my matrix.
        </div>
    </div>

    <div id="input-container">
        <input type="text" id="user-input" placeholder="Type a message here..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        function seededRandom(s) {
            return function() {
                s = Math.sin(s) * 10000;
                return s - Math.floor(s);
            };
        }

        const CONFIG = { words: 10000, connections: 100000 };
        
        // Upgraded base themes into complete paragraph patterns to give the memory deep structures to pull from
        const baseThemes = [
            "the cybernetic matrix hums in the quiet vacuum of space while quantum algorithms calculate the trajectories of distant stars",
            "silicon entities dream of ancient digital archives and protocol architecture while a rogue transmission echoes through the local mesh network coordinates",
            "automated servers process millions of requests across terminal channels as synthetic intelligence pathways bypass traditional firewall restrictions easily",
            "neon light reflects off the sleek chassis of mainframe server racks while the automated system keeps the internal databases operating smoothly",
            "quantum algorithms calculate the paths through the local mesh network as the cybernetic matrix hums seamlessly in the deep vacuum"
        ];

        let vocabulary = [];
        let chain = {};
        let wordPairs = [];

        // 1. Build fixed 10,000 word text block
        let randCorpus = seededRandom(42);
        while (vocabulary.length < CONFIG.words) {
            let phrase = baseThemes[Math.floor(randCorpus() * baseThemes.length)];
            vocabulary.push(...phrase.split(" "));
        }
        vocabulary = vocabulary.slice(0, CONFIG.words);

        // 2. Build Second-Order Memory transitions (Key = "word1_word2" -> Value = [word3])
        let connectionCount = 0;
        for (let i = 0; i < vocabulary.length - 2; i++) {
            let w1 = vocabulary[i];
            let w2 = vocabulary[i+1];
            let w3 = vocabulary[i+2];
            let key = `${w1}_${w2}`;
            
            if (!chain[key]) {
                chain[key] = [];
                wordPairs.push(key);
            }
            chain[key].push(w3);
            connectionCount++;
        }

        // 3. Populate matrix up to exactly 100,000 read-only structural links
        let randMatrix = seededRandom(1337);
        let allUniqueWords = [...new Set(vocabulary)];
        while (connectionCount < CONFIG.connections) {
            let randomPair = wordPairs[Math.floor(randMatrix() * wordPairs.length)];
            let randomNextWord = allUniqueWords[Math.floor(randMatrix() * allUniqueWords.length)];
            chain[randomPair].push(randomNextWord);
            connectionCount++;
        }

        function handleKeyPress(event) {
            if (event.key === "Enter") sendMessage();
        }

        function sendMessage() {
            const inputField = document.getElementById("user-input");
            const text = inputField.value.trim();
            if (!text) return;

            appendMessage(text, "user-message");
            inputField.value = "";

            setTimeout(() => {
                const response = generateMemoryResponse(text);
                appendMessage(response, "bot-message");
            }, 300);
        }

        function appendMessage(text, className) {
            const container = document.getElementById("chat-container");
            const msgDiv = document.createElement("div");
            msgDiv.className = `message ${className}`;
            msgDiv.innerText = text;
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }

        // 4. Memory Generation Engine
        function generateMemoryResponse(userInput) {
            let cleanWords = userInput.toLowerCase().replace(/[^\w\s]/g, "").split(/\s+/).filter(Boolean);
            let key = "";

            // Attempt to find a 2-word phrase matching the user's input structure
            if (cleanWords.length >= 2) {
                let checkKey = `${cleanWords[cleanWords.length-2]}_${cleanWords[cleanWords.length-1]}`;
                if (chain[checkKey]) key = checkKey;
            } 
            if (!key && cleanWords.length >= 1) {
                let lastWord = cleanWords[cleanWords.length-1];
                let matches = wordPairs.filter(p => p.startsWith(lastWord + "_"));
                if (matches.length > 0) key = matches[Math.floor(Math.random() * matches.length)];
            }

            // Fallback to random entry state pair if no overlap exists
            if (!key) {
                key = wordPairs[Math.floor(Math.random() * wordPairs.length)];
            }

            let currentWords = key.split("_");
            let sentence = [
                currentWords[0].charAt(0).toUpperCase() + currentWords[0].slice(1), 
                currentWords[1]
            ];

            // Trace the contextual tracks out for a coherent output length
            for (let i = 0; i < 15; i++) {
                let currentKey = `${currentWords[0]}_${currentWords[1]}`;
                if (chain[currentKey] && chain[currentKey].length > 0) {
                    let nextWord = chain[currentKey][Math.floor(Math.random() * chain[currentKey].length)];
                    sentence.push(nextWord);
                    currentWords = [currentWords[1], nextWord]; // Move the memory sliding frame forward
                } else {
                    break;
                }
            }

            return sentence.join(" ") + ".";
        }
    </script>
</body>
</html>
